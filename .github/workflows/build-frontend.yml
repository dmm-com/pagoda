name: Build frontend

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'e2e/list-search-url.spec.ts'
      - 'e2e/browserQuality.ts'
      - 'e2e/playwright.config.ts'
      - 'e2e/server.mjs'
      - '.github/workflows/build-frontend.yml'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      # Without these, a change that weakens the typecheck gate (relaxing a
      # compiler option, dropping the `typecheck` script) would not run the job
      # that enforces it.
      - 'tsconfig.json'
      - 'tsconfig.lib.json'
      - 'vitest.config.ts'
      - 'tools/publish_coverage_summary.py'
      - '*.config.{js,mjs,ts}'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          registry-url: https://npm.pkg.github.com/
          scope: '@dmm-com'
          cache: 'npm'
      - name: install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: lint
        run: npm run lint
      # `build:lib:types` also runs tsc, but tsconfig.lib.json excludes the test
      # files. Run tsc over tsconfig.json as an explicit step so type errors are
      # reported as such (rather than as a library build failure) and so the
      # test sources are type checked too.
      - name: typecheck
        run: npm run typecheck
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          registry-url: https://npm.pkg.github.com/
          scope: '@dmm-com'
          cache: 'npm'
      - name: install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: build
        run: npm run build:development
      - name: Check list search URLs in Chromium
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=e2e/playwright.config.ts list-search-url.spec.ts
      - name: build(library)
        run: npm run build:lib
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          registry-url: https://npm.pkg.github.com/
          scope: '@dmm-com'
          cache: 'npm'
      - name: install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: test
        run: npm run test
      - name: Upload coverage report
        id: coverage-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: |
            coverage/
            !coverage/coverage-summary.json
          if-no-files-found: error
      - name: Restore frontend coverage baseline
        id: baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .frontend-coverage-baseline
          key: frontend-line-coverage-v1-${{ github.event.pull_request.base.sha }}
      - name: Publish and check frontend coverage
        env:
          REPORT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
          BASELINE_HIT: ${{ steps.baseline.outputs.cache-hit }}
        run: |
          coverage=$(jq -er '.total.lines.pct' coverage/coverage-summary.json)
          args=()
          if [[ "$BASELINE_HIT" == true ]]; then
            args+=(--baseline .frontend-coverage-baseline)
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            printf '%s\n' "$coverage" > .frontend-coverage-baseline
          fi
          python3 tools/publish_coverage_summary.py Frontend "$coverage" "${args[@]}"
      - name: Save frontend coverage baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .frontend-coverage-baseline
          key: frontend-line-coverage-v1-${{ github.sha }}
