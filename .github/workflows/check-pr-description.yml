name: Check PR description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Require Why and What sections
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event:
              body = json.load(event)["pull_request"]["body"] or ""

          body = re.sub(r"<!--.*?(?:-->|\Z)", "", body, flags=re.DOTALL)
          sections = re.split(r"^ {0,3}#{1,6}[ \t]+([^\n]+)\n?", body, flags=re.MULTILINE)
          filled = {
              heading.strip().rstrip("#").strip().casefold()
              for heading, content in zip(sections[1::2], sections[2::2])
              if content.strip()
          }
          missing = [heading for heading in ("Why", "What") if heading.lower() not in filled]
          if missing:
              print(f"::error::Fill in the following PR sections in English: {', '.join(missing)}")
              raise SystemExit(1)
          PY
