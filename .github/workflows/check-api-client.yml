name: Check generated API client

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Pagoda env
        uses: ./.github/actions/setup-pagoda-env
        with:
          clone: "false"
          base-dir: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate API client
        run: npm run generate:client
      - name: Check committed generated files
        run: |
          client=frontend/src/apiclient/autogenerated
          if [ -n "$(git status --porcelain --untracked-files=all -- "$client")" ]; then
            git diff -- "$client"
            git status --short --untracked-files=all -- "$client"
            echo "::error::Run npm run generate:client and commit all generated changes."
            exit 1
          fi
