services:
  airone:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_ID: ${UID:-1000}
    container_name: airone
    hostname: airone
    command: sleep infinity
    ports:
      - 8080:8080
    environment:
      AIRONE_MYSQL_MASTER_URL: "mysql://airone:password@mysql:3306/airone?charset=utf8mb4"
      AIRONE_ELASTICSEARCH_URL: "elasticsearch://airone:password@elasticsearch:9200/airone"
      AIRONE_RABBITMQ_URL: "amqp://guest:guest@rabbitmq//"
    volumes:
      - .:/workspace/airone/
      - ~/.gitconfig:/home/airone/.gitconfig
      - ~/.claude:/home/airone/.claude
      # Keep Linux-only build artifacts and package caches out of the bind
      # mount. They must not be shared with the host (platform-specific
      # binaries) and named volumes let them survive container rebuilds.
      # The mount points are pre-created in .devcontainer/Dockerfile so that
      # they are owned by the container user.
      - venv:/workspace/airone/.venv
      - node-modules:/workspace/airone/node_modules
      - uv-cache:/home/airone/.cache/uv
      - npm-cache:/home/airone/.npm
      - playwright-cache:/home/airone/.cache/ms-playwright
      # Configuration and credentials that tools create inside the container,
      # such as the GitHub CLI login, so that a rebuild does not require
      # authenticating again. Not shared with the host, because the host config
      # may belong to another platform.
      - config:/home/airone/.config

volumes:
  venv:
    driver: local
  node-modules:
    driver: local
  uv-cache:
    driver: local
  npm-cache:
    driver: local
  playwright-cache:
    driver: local
  config:
    driver: local
