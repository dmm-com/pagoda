coverage:
  paths:
    - coverage-reports/**/coverage.xml  # Python coverage from coverage.py (one report per test matrix target)
    - coverage/lcov.info                # Frontend coverage from Vitest
comment:
  if: true                     # Always comment on PRs
report:
  if: is_pull_request          # Generate report for PRs
badge:
  path: coverage               # Generate coverage badge
datastore:
  github:
    if: is_default_branch      # Store data only on main branch