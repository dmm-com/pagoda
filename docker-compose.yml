# Full container stack. Prefer `tools/lite.sh run` for day-to-day work: it
# needs none of these.
#
# Host ports and the compose project name are per-checkout, so several git
# worktrees can run their own stack at the same time. Start it through
# `tools/lite.sh compose up -d`, which exports the right values; a bare
# `docker compose up` falls back to the historical fixed ports.
services:
  mysql:
    platform: linux/x86_64
    image: mysql:8.0.36
    hostname: mysql
    restart: unless-stopped
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_as_cs
    ports:
      - ${PAGODA_MYSQL_PORT:-3306}:3306
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: "Asia/Tokyo"
    volumes:
      - mysql:/var/lib/mysql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: "single-node"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - ${PAGODA_ES_PORT:-9200}:9200
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  rabbitmq:
    image: rabbitmq:4.1.3-management
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - ${PAGODA_RABBITMQ_PORT:-5672}:5672
      - ${PAGODA_RABBITMQ_MGMT_PORT:-15672}:15672

volumes:
  mysql:
    driver: local
  elasticsearch-data:
    driver: local
